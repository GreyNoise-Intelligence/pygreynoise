[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "greynoise"
version = "3.0.2"
description = "Abstraction to interact with GreyNoise API."
readme = {file = "README.rst", content-type = "text/x-rst"}
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "GreyNoise Intelligence", email = "support@greynoise.io"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
keywords = ["internet", "scanning", "threat intelligence", "security"]
dependencies = [
    "Click<=8.1.8; python_version < '3.10'",
    "Click==8.3.1; python_version >= '3.10'",
    "ansimarkup==2.2.0",
    "cachetools==5.5.2; python_version == '3.8'",
    "cachetools==6.2.6; python_version == '3.9'",
    "cachetools==7.0.5; python_version >= '3.10'",
    "colorama==0.4.6",
    "click-default-group==1.2.4",
    "click-repl==0.3.0",
    "dict2xml==1.7.8",
    "jinja2==3.1.6",
    "more-itertools==10.5.0; python_version == '3.8'",
    "more-itertools==10.8.0; python_version >= '3.9'",
    "requests==2.32.4; python_version == '3.8'",
    "requests==2.32.5; python_version >= '3.9'",
    "six==1.17.0",
]

[project.urls]
Homepage = "https://greynoise.io/"
Repository = "https://github.com/GreyNoise-Intelligence/pygreynoise"
Documentation = "https://greynoise.io/"

[project.scripts]
greynoise = "greynoise.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/greynoise"]

[tool.hatch.build.targets.wheel.shared-data]
"src/greynoise/cli/templates/*.j2" = "greynoise/cli/templates" 